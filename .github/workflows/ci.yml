name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: extractions/setup-just@v2
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet -tags=integration ./...
      - name: staticcheck
        run: just lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: extractions/setup-just@v2
      - run: just test
      - run: just test-race

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: cross compile
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/smob

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fast suite on an Alpine kernel
        run: >
          docker run --rm -v "$PWD:/src" -w /src golang:1.27-alpine
          sh -c 'apk add --no-cache git && go test -tags=integration -count=1 ./test/integration/...'
